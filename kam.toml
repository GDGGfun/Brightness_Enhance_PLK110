# =============================================================================
# Kam 工程配置（MemDeco-WG/Kam）
# 结构：kam.toml + src/<module-id>/  →  src/Brightness_Enhance_PLK110/
#
# 注意：本机暂时无法编译 Kam（缺 mingw 的 dlltool，且 rustup 域名被网络限制），
#       因此本文件尚未被 `kam validate/build` 实际校验过。
#       Kam 可用后请依次执行：
#         kam validate          # 校验 kam.toml
#         kam export            # 由本文件生成 module.prop / module.json / update.json
#         kam build --release --sign
#
# ★★★ 执行 `kam export` 后必须检查 update.json 的 zipUrl（重要） ★★★
#   Kam 的 build_update_json() 把 zipUrl 硬编码为：
#       <repository>/releases/latest/download/<id>.zip
#   它**不带** gh-proxy 国内加速前缀，会覆盖掉手工加的代理前缀。
#   每次 export 后请运行： python tools/check_update_json.py
#   若报错，按报错提示把 update.json 的 zipUrl 改回代理形式。
# =============================================================================

[prop]
id = "Brightness_Enhance_PLK110"
name = "[OnePlus 15] 自动亮度优化增强"
version = "v1.9"
versionCode = 190
author = "@GDGGfun"
description = "调整自动亮度曲线，提高最大亮度至2200nit，降低激发亮度阈值，亮度可自动1nit，移除导航应用亮度特调，WebUI拓展功能"
updateJson = "https://raw.githubusercontent.com/GDGGfun/Brightness_Enhance_PLK110/main/update.json"
metamodule = false

[mmrl.repo]
license = "MIT"
license_file = ""
homepage = "https://github.com/GDGGfun/Brightness_Enhance_PLK110"
readme = ""
readme_file = "README.md"
# 与 update.json 的 changelog 保持一致：指向 raw Markdown（KSU 管理器会把该 URL 的
# 响应体当作 Markdown 正文渲染进更新弹窗，因此**不能**填 /releases/latest 这类网页）。
changelog = "https://raw.githubusercontent.com/GDGGfun/Brightness_Enhance_PLK110/main/CHANGELOG.md"
changelog_file = "CHANGELOG.md"
screenshots = []
categories = ["display", "performance"]
keywords = ["brightness", "display", "oplus", "oneplus", "plk110", "autobrightness"]
maintainers = []
repository = "https://github.com/GDGGfun/Brightness_Enhance_PLK110"
documentation = ""
issues = "https://github.com/GDGGfun/Brightness_Enhance_PLK110/issues"
funding = ""
support = ""
donate = ""
cover = ""
icon = ""
devices = ["PLK110", "CPH2747", "OP60FFL1"]
arch = ["arm64-v8a"]
require = []
antifeatures = []
max_num = 0
min_api = 33
max_api = 99
verified = false
features = ["webui", "brightness-curve", "nav-app-brightness"]

[kam]
module_type = "module"

[kam.build]
target_dir = "dist"
output_file = "Brightness_Enhance_PLK110_v1.9"
hooks_dir = "hooks"

[kam.workspace]
members = ["."]

[tool]
